name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudcare
          POSTGRES_PASSWORD: cloudcare
          POSTGRES_DB: cloudcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudcare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: production
      SECRET_KEY: ci-secret-key-not-for-real-use-0123456789abcdef
      DATABASE_URL: postgresql://cloudcare:cloudcare@localhost:5432/cloudcare_test
      CORS_ORIGINS: http://localhost:5500

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloudcare-api/requirements-dev.txt

      - name: Install dependencies
        working-directory: cloudcare-api
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations against Postgres
        working-directory: cloudcare-api
        run: alembic upgrade head

      - name: Check for model/migration drift
        working-directory: cloudcare-api
        run: alembic check

      - name: Run pytest (SQLite test suite)
        working-directory: cloudcare-api
        env:
          ENV: development
        run: pytest -v
