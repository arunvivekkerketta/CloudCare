<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("cloudcare_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — CloudCare</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B5%3C/text%3E%3C/svg%3E">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <path d="M11 25a7 7 0 0 1 1-13.9A9 9 0 0 1 29 13.6 6.5 6.5 0 0 1 28 26H12a5 5 0 0 1-1-1Z" fill="#4fd1c5" stroke="#0b3b36" stroke-width="1.6"/>
        <path d="M6 22h5l2-4 3 7 2-9 2 6h6" stroke="#ff6f59" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      CloudCare
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="reviews.html">Reviews</a>
    </div>
    <div class="nav-cta">
      <a href="login.html" class="btn btn-ghost btn-sm">Sign in</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card reveal in">
    <div class="logo-row">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <path d="M11 25a7 7 0 0 1 1-13.9A9 9 0 0 1 29 13.6 6.5 6.5 0 0 1 28 26H12a5 5 0 0 1-1-1Z" fill="#4fd1c5" stroke="#0b3b36" stroke-width="1.6"/>
        <path d="M6 22h5l2-4 3 7 2-9 2 6h6" stroke="#ff6f59" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <strong style="font-family:'Fraunces',serif;font-size:1.2rem;">CloudCare</strong>
    </div>
    <h1 style="font-size:1.7rem;margin-top:14px;">Create Your Account</h1>
    <p style="margin-bottom:26px;">Book appointments, view your records and message your care team — all in one place.</p>

    <input type="hidden" id="regRole" value="patient">

    <form id="registerForm">
      <div class="field">
        <label for="regName">Full name</label>
        <input id="regName" type="text" placeholder="e.g. Alex Rao" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" placeholder="you@cloudcare.demo" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="regPassword">Password</label>
        <input id="regPassword" type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" maxlength="128" pattern=".*(?=.*[A-Za-z])(?=.*\d).*" title="At least 8 characters, including a letter and a number." required>
        <span class="field-hint">At least 8 characters, including a letter and a number.</span>
      </div>
      <div class="field">
        <label for="regConfirmPassword">Confirm password</label>
        <input id="regConfirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script>
ccHandleRegister('#registerForm');
</script>
</body>
</html>
