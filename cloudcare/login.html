<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("cloudcare_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — CloudCare</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B5%3C/text%3E%3C/svg%3E">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <path d="M11 25a7 7 0 0 1 1-13.9A9 9 0 0 1 29 13.6 6.5 6.5 0 0 1 28 26H12a5 5 0 0 1-1-1Z" fill="#4fd1c5" stroke="#0b3b36" stroke-width="1.6"/>
        <path d="M6 22h5l2-4 3 7 2-9 2 6h6" stroke="#ff6f59" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      CloudCare
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="reviews.html">Reviews</a>
    </div>
    <div class="nav-cta">
      <a href="register.html" class="btn btn-primary btn-sm">Create account</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card reveal in">
    <div class="logo-row">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <path d="M11 25a7 7 0 0 1 1-13.9A9 9 0 0 1 29 13.6 6.5 6.5 0 0 1 28 26H12a5 5 0 0 1-1-1Z" fill="#4fd1c5" stroke="#0b3b36" stroke-width="1.6"/>
        <path d="M6 22h5l2-4 3 7 2-9 2 6h6" stroke="#ff6f59" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <strong style="font-family:'Fraunces',serif;font-size:1.2rem;">CloudCare</strong>
    </div>
    <h1 style="font-size:1.7rem;margin-top:14px;">Welcome back</h1>
    <p style="margin-bottom:26px;">Sign in to your dashboard.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="you@cloudcare.demo" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" required>
        <a href="#" class="auth-link" onclick="event.preventDefault(); ccOpenForgotPassword();" style="display:inline-block;margin-top:8px;font-size:.8rem;">Forgot password?</a>
      </div>
      <div class="field" style="display:flex;align-items:center;gap:10px;margin-top:-4px;">
        <input id="loginRemember" type="checkbox" style="width:auto;margin:0;">
        <label for="loginRemember" style="margin:0;font-size:.85rem;font-weight:600;">Keep me signed in on this device</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <p class="form-error" id="loginError" data-form-error role="alert" hidden></p>
    </form>

    <p class="auth-switch">New to CloudCare? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  ccHandleLogin('#loginForm');
</script>
</body>
</html>
