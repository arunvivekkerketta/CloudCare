# Render Blueprint — CloudCare API + managed Postgres.
# Deploy: Render Dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: cloudcare-api
    runtime: python
    rootDir: cloudcare-api
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    # Pre-deploy gate: migrate before the new code serves traffic.
    preDeployCommand: "alembic upgrade head"
    startCommand: "gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT --timeout 60"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudcare-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://cloudcare.netlify.app"   # ← change to your Netlify URL
      - key: DB_SSLMODE
        value: require

  - type: pgsql
    name: cloudcare-db
    plan: basic-256mb
    databaseName: cloudcare
    user: cloudcare
